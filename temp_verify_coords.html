<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Verificación de Coordenadas de Gimnasios</title>
  <style>
    body { background: #0b1220; color: #fff; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
    .region-card { margin-bottom: 32px; }
    .region-title { font-size: 1.2rem; margin-bottom: 12px; }
    .map-container { position: relative; display: inline-block; border: 2px solid rgba(255,255,255,.08); border-radius: 16px; overflow: hidden; }
    .map-container img { display: block; max-width: 100%; height: auto; }
    .marker { position: absolute; width: 24px; height: 24px; border-radius: 9999px; background: rgba(239,68,68,.95); border: 2px solid #fff; box-shadow: 0 0 12px rgba(239,68,68,.8); transform: translate(-50%, -50%); }
    .marker::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 12px; background: #fff; border-radius: 9999px; transform: translate(-50%, -50%); }
    .label { position: absolute; left: calc(var(--x)% + 18px); top: calc(var(--y)% - 10px); background: rgba(0,0,0,.75); color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
    .region-meta { margin-bottom: 8px; display: flex; gap: 12px; flex-wrap: wrap; }
    .region-meta span { background: rgba(255,255,255,.08); padding: 4px 8px; border-radius: 999px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Verificación de coordenadas de gimnasios</h1>
  <div id="content"></div>
  <script>
    const coords = {
      "Endrino": { region: "Johto", x: 86, y: 9 },
      "Trigal": { region: "Johto", x: 46, y: 56 },
      "Azalea": { region: "Johto", x: 46, y: 83 },
      "Olivo": { region: "Johto", x: 19, y: 65 },
      "Orquídea": { region: "Johto", x: 6, y: 32 },
      "Caoba": { region: "Johto", x: 52, y: 24 },
      "Malva": { region: "Johto", x: 82, y: 43 },
      "Pueblo Azuliza": { region: "Hoenn", x: 10, y: 71 },
      "Ciudad Férrica": { region: "Hoenn", x: 11, y: 14 },
      "Ciudad Malvalona": { region: "Hoenn", x: 42, y: 51 },
      "Ciudad Petalia": { region: "Hoenn", x: 26, y: 79 },
      "Pueblo Lavacalda": { region: "Hoenn", x: 33, y: 16 },
      "Ciudad Arborada": { region: "Hoenn", x: 72, y: 14 },
      "Ciudad Vetusta": { region: "Sinnoh", x: 16, y: 18 },
      "Ciudad Pirita": { region: "Sinnoh", x: 32, y: 55 },
      "Ciudad Canal": { region: "Sinnoh", x: 9, y: 60 },
      "Ciudad Rocavelo": { region: "Sinnoh", x: 77, y: 46 },
      "Pueblo Pastoria": { region: "Sinnoh", x: 79, y: 78 },
      "Carmín": { region: "Kanto", x: 59, y: 76 },
      "Isla Canela": { region: "Kanto", x: 31, y: 90 },
      "Plateada": { region: "Kanto", x: 18, y: 17 },
      "Celeste": { region: "Kanto", x: 64, y: 18 },
      "Azulona": { region: "Kanto", x: 38, y: 48 },
      "Fucsia": { region: "Kanto", x: 84, y: 71 },
      "Porcelana": { region: "Unova", x: 50, y: 78 },
      "Mayólica": { region: "Unova", x: 45, y: 40 },
      "Fayenza": { region: "Unova", x: 30, y: 45 },
      "Loza": { region: "Unova", x: 22, y: 30 },
      "Caolín": { region: "Unova", x: 55, y: 30 },
      "Striaton": { region: "Unova", x: 84, y: 58 }
    };
    const base = {
      Johto: 'public/images/maps/map_johto.png',
      Hoenn: 'public/images/maps/map_hoenn.png',
      Sinnoh: 'public/images/maps/map_sinnoh.png',
      Kanto: 'public/images/maps/map_kanto.png',
      Unova: 'public/images/maps/map_unova.png'
    };
    const grouped = Object.entries(coords).reduce((acc, [name, data]) => {
      acc[data.region] = acc[data.region] || [];
      acc[data.region].push({ name, ...data });
      return acc;
    }, {});
    const content = document.getElementById('content');
    for (const region of Object.keys(base)) {
      const wrapper = document.createElement('div');
      wrapper.className = 'region-card';
      const title = document.createElement('div');
      title.className = 'region-title';
      title.textContent = `${region} (${(grouped[region] || []).length} gimnasios)`;
      wrapper.appendChild(title);
      const meta = document.createElement('div');
      meta.className = 'region-meta';
      meta.innerHTML = `<span>Mapa: ${base[region]}</span><span>Gimnasios: ${(grouped[region] || []).map(g => g.name).join(', ')}</span>`;
      wrapper.appendChild(meta);
      const map = document.createElement('div');
      map.className = 'map-container';
      const img = document.createElement('img');
      img.src = base[region];
      img.alt = `${region} map`;
      map.appendChild(img);
      const markers = grouped[region] || [];
      markers.forEach(item => {
        const m = document.createElement('div');
        m.className = 'marker';
        m.style.left = item.x + '%';
        m.style.top = item.y + '%';
        map.appendChild(m);
        const label = document.createElement('div');
        label.className = 'label';
        label.style.setProperty('--x', item.x);
        label.style.setProperty('--y', item.y);
        label.textContent = item.name;
        map.appendChild(label);
      });
      wrapper.appendChild(map);
      content.appendChild(wrapper);
    }
  </script>
</body>
</html>
